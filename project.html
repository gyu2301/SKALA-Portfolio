<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="최규원의 데이터 분석 및 AI 프로젝트 상세 페이지"
    data-i18n-content="meta.detailDescription"
  >

  <title>프로젝트 상세 | 최규원</title>

  <!-- 디자인 파일 연결 -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 프로젝트 정보 파일을 먼저 불러옵니다. -->
  <script src="js/projects.js" defer></script>
  <script src="js/projects-en.js" defer></script>

  <!-- 언어 전환 기능 파일을 불러옵니다. -->
  <script src="js/i18n.js" defer></script>

  <!-- 상세 페이지 기능 파일을 불러옵니다. -->
  <script src="js/project-detail.js" defer></script>
</head>

<body>
  <!-- 상단 메뉴 -->
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        GYUWON<span>.</span>
      </a>

      <div class="header-right">
        <nav class="nav">
          <a href="index.html#home">Home</a>
          <a href="index.html#projects">Projects</a>
          <a href="index.html#skills">Skills</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contact">Contact</a>
        </nav>

        <!-- 언어 전환 버튼 (i18n.js) -->
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="ko" lang="ko">KO</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- JavaScript가 프로젝트 상세 내용을 넣는 공간 -->
    <div id="project-detail">
      <section class="section">
        <div class="container">
          <p class="loading-message" data-i18n="projects.loading">
            프로젝트 정보를 불러오는 중입니다.
          </p>
        </div>
      </section>
    </div>
  </main>

  <!-- 하단 -->
  <footer class="footer">
    <div class="container footer-container">
      <p>© 2026 Choi Gyuwon. All rights reserved.</p>

      <a href="index.html" data-i18n="footer.home">
        메인 화면으로
      </a>
    </div>
  </footer>
</body>
</html>
