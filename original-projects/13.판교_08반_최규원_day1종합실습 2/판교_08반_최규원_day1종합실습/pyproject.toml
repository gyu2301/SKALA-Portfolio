# ==============================================================================
# 이 파일의 역할: pytest / ruff 설정
#
# [버그 수정 이력]
# 2026-08-06  pytest.ini_options.pythonpath 추가.
#   [원인] 프로젝트 루트에서 `pytest -v`를 그냥 실행하면(= `python -m pytest`가
#   아니라 bare pytest), 현재 폴더가 sys.path에 자동으로 추가되지 않는다.
#   tests/ 폴더에는 __init__.py도 없어서 pytest가 tests/ 자체만 import 경로로
#   잡고, src 패키지가 있는 프로젝트 루트는 경로에 없어 tests/test_schema.py의
#   `from src.schema import ...` 가 "ModuleNotFoundError: No module named 'src'"
#   로 실패했다.
#   [해결] pythonpath = ["."] 를 지정하면 pytest가 실행 시 프로젝트 루트를
#   sys.path 맨 앞에 넣어주므로, 어디서 실행하든(루트 기준) src를 찾을 수 있다.
# ==============================================================================

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # 에러 / 경고 / 임포트정렬 / 문법업그레이드
ignore = ["E501"]                # 긴 줄 허용

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
